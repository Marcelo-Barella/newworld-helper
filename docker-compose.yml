services:
  app:
    build: .
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    environment:
      PUBLIC_PORT: "8080"
      API_HOST: "127.0.0.1"
      API_PORT: "4000"
      DATA_DIR: "/app/data"
      NUXT_PUBLIC_API_BASE: "/api/v1"
      NODE_ENV: "production"
      HOST: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s